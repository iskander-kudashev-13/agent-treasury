[package]
name = "agent-treasury-vault"
version = "0.1.0"
edition = "2024"
# wasm is built with 1.86 (max allowed by the NEAR runtime check in cargo-near); keeps clippy from suggesting newer syntax
rust-version = "1.86"
description = "Agent Treasury vault: a USDC treasury on NEAR that a TEE-attested AI agent can only spend within owner-defined policies"
license = "MIT"
repository = "https://github.com/iskander-kudashev-13/agent-treasury"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.19.0-rust-1.86.0"
image_digest = "sha256:772638e343baeeea24e49062c7d424274f3441452cc06ce97fc4e5695b19fecc"
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
near-sdk = "=5.26.1"
serde = { version = "=1.0.228", features = ["derive"] }
# TEE attestation verification (Intel TDX / dstack), from the Shade Agent template v2. See docs/adr/0001.
shade-attestation = "=0.2.0"

[dev-dependencies]
near-sdk = { version = "=5.26.1", features = ["unit-testing"] }
shade-attestation = "=0.2.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Arithmetic overflow aborts the call instead of wrapping (money safety).
overflow-checks = true
